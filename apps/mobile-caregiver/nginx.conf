server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Flutter web은 SPA입니다. 새로고침으로 들어온 경로도 index.html로 보냅니다.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 빌드 산출물은 해시가 붙어 있어 오래 캐시해도 됩니다.
  location ~* \.(js|wasm|png|jpg|svg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # index.html은 캐시하지 않습니다 — 새 빌드가 안 보이는 원인이 여기입니다.
  location = /index.html {
    add_header Cache-Control "no-store";
  }
}
