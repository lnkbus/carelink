name: carelink_field
description: CARELINK FIELD 앱 — 후보자 · 간병사 · 보호자 (SCR-101~110 · 301~307 · 401~404)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # FIELD 토큰·API 클라이언트·위젯. DESK(웹)와 값이 어긋나지 않도록
  # packages/ui/test/tokens.spec.ts가 두 스케일을 교차 검사합니다.
  carelink_field_ui:
    path: ../../packages/field_ui
  # 상태 관리는 ChangeNotifier + InheritedNotifier로 충분합니다.
  # 여기서 관리하는 것은 세션·로케일·활성 역할 셋뿐입니다.
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
