# CARELINK 전체 스택.
#
#   docker compose up -d --build
#
# 뜨는 것:
#   :3000  API            (/api/v1)
#   :3100  웹              운영 콘솔 + 기관 웹. 로그인하면 역할이 갈라 줍니다 —
#                          운영자는 /admin, 기관 담당자는 /org.
#   :3300  앱(웹 빌드)     후보자 · 간병사 · 보호자. 역할이 셸을 정합니다.
#                          SCR-101~110 · 301~307 · 401~404
#                          검증용입니다 — 실배포는 스토어입니다.
#   :5432  PostgreSQL 16
#   :6379  Redis 7
#
# 개발 편의를 위해 비밀번호가 평문으로 들어 있습니다. **운영에 그대로 쓰지 마세요.**
# 운영에서는 .env 또는 시크릿 매니저로 주입하고, DB·Redis 포트를 외부에 열지 마세요.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carelink
      POSTGRES_PASSWORD: carelink
      POSTGRES_DB: carelink
      # 한국어 정렬·검색을 위해 로케일을 맞춥니다.
      LANG: ko_KR.utf8
    # 맥에는 로컬 Postgres가 이미 5432를 쓰는 일이 흔합니다.
    ports: ['${DB_PORT:-55432}:5432']
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carelink -d carelink']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ['${REDIS_PORT:-56379}:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # 마이그레이션 + 시드. 한 번 돌고 끝납니다 — 다시 불려도 안전합니다.
  #
  # API에 넣지 않은 이유: API를 여러 개 띄우면 마이그레이션이 동시에 돌고,
  # 그중 하나는 반드시 실패합니다. 스키마 적용은 한 번만 일어나야 합니다.
  migrate:
    image: postgres:16-alpine
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: carelink
      PGDATABASE: carelink
      PGPASSWORD: carelink
    volumes:
      - ./infra/migrations:/migrations:ro
    # 재실행 가능해야 합니다. `docker compose run --rm tools ...`가
    # api → migrate 의존을 따라 이 컨테이너를 다시 돌리기 때문입니다.
    # 스크립트가 '이미 적용됨'을 확인하고 건너뜁니다.
    entrypoint: ['sh']
    command: ['/migrations/apply.sh']
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://carelink:carelink@db:5432/carelink
      REDIS_URL: redis://redis:6379
      # 개발용 고정값. 운영에서는 반드시 주입하세요 —
      # 이 값이 노출되면 아무나 운영자 토큰을 발급할 수 있습니다.
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      NODE_ENV: production
      PORT: 3000
      # 인증번호를 로그인 화면에 그대로 띄웁니다. **이 스택은 데모입니다** —
      # SMS 발송이 붙어 있지 않아 이게 없으면 아무도 로그인할 수 없습니다.
      #
      # NODE_ENV로 갈랐더니 이미지가 프로덕션 빌드라 항상 닫혀 있었습니다.
      # 운영에 올릴 때는 이 줄을 지우세요 — 켜져 있으면 전화번호만 아는
      # 사람이 남의 계정으로 로그인합니다. API가 부팅 로그에 경고를 찍습니다.
      AUTH_EXPOSE_OTP_CODE: ${AUTH_EXPOSE_OTP_CODE:-true}
      # 브라우저에서 API를 직접 부르는 출처. 와일드카드를 쓰지 않습니다 —
      # 이 API는 후보자의 실명·연락처·체류자격을 다룹니다.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3100,http://localhost:3300}
    ports: ['3000:3000']

  # 웹 한 벌 — 운영 콘솔(/admin)과 기관 웹(/org)이 같은 서비스입니다.
  #
  # 나눠 두었을 때는 담당자가 주소를 외워야 했고, 잘못 들어간 사람은 로그인
  # 화면에서 막혔습니다 — 계정은 멀쩡한데 문이 틀린 것이라 원인을 알 수
  # 없었습니다. 이제 로그인 한 번에 역할이 목적지를 정합니다.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api: { condition: service_healthy }
    environment:
      # 서버 컴포넌트는 컨테이너 네트워크 안에서 api를 부릅니다.
      CARELINK_API_URL: http://api:3000/api/v1
      # 브라우저(로그인 화면)는 호스트에서 부르므로 localhost입니다.
      # 둘을 같은 값으로 두면 한쪽이 반드시 실패합니다.
      NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
      # 인트로의 역할 카드 두 개(간병인 지원 · 간병인 찾기)가 앱으로 나갑니다.
      # 그 화면들은 웹에 없습니다 (CLAUDE.md §4.1).
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3300}
    ports: ['3100:3100']

  # FIELD 앱 한 벌 — 후보자 · 간병사 · 보호자. 웹 빌드입니다.
  #
  # 셋으로 나눠 두었을 때는 한 계정이 역할을 여러 개 가지면 앱을 두 개
  # 설치해야 했고, 실제로는 다시 가입하는 사람이 생겼습니다. 계정이 갈라지면
  # 경력도 서류도 이어지지 않습니다. 이제 앱은 하나이고 역할이 셸을 정합니다.
  #
  # 보호자 화면은 종전에 별도 Next.js 웹(:3400)이었습니다. '보호자는 설치
  # 의사가 낮고 링크로 들어온다'는 이유였는데 (SCR-301 notes), 이 웹 빌드가
  # 그 경로를 그대로 대신합니다.
  #
  # 화면 흐름·번역·API 연동 확인용입니다. 터치 타깃과 글꼴 크기는
  # 실기기에서 최종 확인하세요 (docs/14 §3).
  app:
    # Flutter 이미지가 2GB대라 첫 빌드가 깁니다. 기본에서 빼 두었습니다.
    #   docker compose --profile mobile up -d --build
    profiles: ['mobile']
    build:
      # 공용 FIELD 패키지(packages/field_ui)가 path 의존이라 컨텍스트가
      # 리포 루트여야 합니다. 앱 디렉터리만 주면 pub get이 실패합니다.
      context: .
      dockerfile: apps/mobile/Dockerfile
      args:
        CARELINK_API_URL: http://localhost:3000/api/v1
    depends_on:
      api: { condition: service_healthy }
    ports: ['3300:80']

  # 시드·스모크 실행용. 맥에 psql·redis-cli가 없어도 됩니다.
  #   docker compose run --rm tools demo
  #   docker compose run --rm tools smoke
  tools:
    profiles: ['tools']
    build:
      context: .
      dockerfile: infra/tools/Dockerfile
    depends_on:
      api: { condition: service_healthy }

volumes:
  db-data:
