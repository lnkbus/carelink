<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CARELINK · 화면 정의 & 클릭형 와이어프레임</title>
<!--
  ============================================================================
  CARELINK PLATFORM — INTERACTIVE WIREFRAME / SCREEN SPEC BROWSER
  ============================================================================
  이 파일은 "그림"이 아니라 "실행 가능한 화면 정의서"입니다.
  아래 SCREENS 배열이 곧 개발 사양이며, 각 항목의 필드는 다음을 의미합니다.

    id      : 화면 ID (SCR-xxx). PRD/지라 티켓/컴포넌트 파일명과 1:1 대응.
    app     : 소속 클라이언트 (common | candidate | org | patient | caregiver | admin)
    device  : mobile | desktop  → 프레임 폭 결정
    phase   : V1 | V2 | V3      → MVP 개발 범위 절단선
    title   : 화면명
    route   : 프론트엔드 라우트 경로 (Next.js / Flutter GoRouter 기준)
    api     : 이 화면이 호출하는 백엔드 엔드포인트 목록
    data    : 화면이 다루는 핵심 데이터 필드 (DB 컬럼과 대응)
    states  : 이 화면에서 관리해야 하는 상태값 / 상태머신
    notes   : 법규·정책·운영 제약 (개발 시 반드시 반영)
    next    : 이 화면에서 진입 가능한 다음 화면 ID
    body    : 와이어프레임 마크업 (의도적으로 저충실도)

  Claude Code 사용법:
    1) 이 파일의 SCREENS 배열을 읽어 화면 목록과 사양을 파악한다.
    2) docs/02_ARCHITECTURE.md 의 모듈 경계와 docs/schema.sql 의 테이블에 매핑한다.
    3) phase === 'V1' 인 화면만 먼저 구현한다. V2/V3는 스텁만 만든다.
    4) data-go 속성은 화면 전이(navigation)를 의미한다. 실제 구현 시 라우팅으로 대체.
  ============================================================================
-->
<style>
/* ── 디자인 토큰 ────────────────────────────────────────────────────────────
   와이어프레임은 색으로 설득하지 않는다. 회색조 + 단일 시그널 컬러만 사용.
   signal(pine) = 사용자가 누를 수 있는 것 / 현재 상태
   flag(amber)  = 운영자 개입 또는 법적 검토가 필요한 지점
   ------------------------------------------------------------------------ */
:root{
  --paper:#E7EAED; --surface:#FFFFFF; --surface-2:#F4F6F8;
  --ink:#131A21; --ink-2:#5C6873; --ink-3:#8D99A5;
  --line:#CDD5DC; --line-2:#9EAAB6;
  --signal:#1F6F5C; --signal-bg:#E6F0ED;
  --flag:#A45E15; --flag-bg:#FAF0E2;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.55;
     -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── 셸 레이아웃 ─────────────────────────────────────────────────────────── */
.top{position:sticky;top:0;z-index:20;height:56px;background:var(--ink);color:#fff;
     display:flex;align-items:center;gap:20px;padding:0 20px}
.brand{font-weight:700;letter-spacing:.14em;font-size:13px}
.brand span{color:var(--ink-3);font-weight:500;letter-spacing:.02em;margin-left:10px}
.top .spacer{flex:1}
.phasefilter{display:flex;gap:2px;background:#26313C;border-radius:5px;padding:3px}
.phasefilter button{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:3px;color:#9DABB8}
.phasefilter button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:600}
.pager{display:flex;gap:4px}
.pager button{width:30px;height:30px;border:1px solid #3B4854;border-radius:5px;color:#C6D0DA;font-size:15px}
.pager button:hover{background:#26313C}

.shell{display:grid;grid-template-columns:242px minmax(0,1fr) 336px;
       height:calc(100vh - 56px);}

/* ── 좌: 화면 인덱스 ─────────────────────────────────────────────────────── */
.nav{background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding-bottom:40px}
.nav h3{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink-3);
        padding:16px 16px 6px;text-transform:uppercase}
.nav h3 em{font-style:normal;color:var(--line-2)}
.navitem{display:flex;gap:9px;align-items:baseline;width:100%;text-align:left;
         padding:6px 16px;border-left:2px solid transparent;color:var(--ink-2)}
.navitem:hover{background:var(--surface-2)}
.navitem[aria-current="true"]{background:var(--signal-bg);border-left-color:var(--signal);
         color:var(--ink);font-weight:600}
.navitem code{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);flex:none}
.navitem[aria-current="true"] code{color:var(--signal)}
.navitem.dim{opacity:.34}

/* ── 중: 캔버스 ─────────────────────────────────────────────────────────── */
.canvas{overflow-y:auto;padding:28px 32px 64px;display:flex;flex-direction:column;align-items:center}
.canvashead{width:100%;max-width:920px;display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
.canvashead code{font-family:var(--mono);font-size:12px;color:var(--ink-2);
                 background:var(--surface);border:1px solid var(--line);padding:2px 7px;border-radius:4px}
.canvashead h2{font-size:19px;letter-spacing:-.01em}
.canvashead .tag{margin-left:auto}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:3px 7px;border-radius:3px;
     border:1px solid var(--line-2);color:var(--ink-2);background:var(--surface)}
.tag.v1{border-color:var(--signal);color:var(--signal);background:var(--signal-bg)}
.tag.v3{opacity:.6}

/* 디바이스 프레임 */
.frame{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;
       box-shadow:0 1px 0 rgba(19,26,33,.04),0 12px 32px -18px rgba(19,26,33,.5);overflow:hidden}
.frame.mobile{width:372px}
.frame.desktop{width:100%;max-width:920px}
.frame .chrome{height:26px;background:var(--surface-2);border-bottom:1px solid var(--line);
       display:flex;align-items:center;gap:5px;padding:0 10px}
.frame .chrome i{width:7px;height:7px;border-radius:50%;background:var(--line-2);display:block}
.frame .chrome span{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-left:8px}
.screen{padding:0}

/* ── 우: 사양 패널 (이 도구의 핵심) ──────────────────────────────────────── */
.spec{background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;padding:22px 20px 60px}
.spec h4{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink-3);
         text-transform:uppercase;margin:20px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.spec h4:first-child{margin-top:0}
.spec ul{list-style:none}
.spec li{padding:3px 0;font-size:12.5px;color:var(--ink-2);display:flex;gap:7px}
.spec li::before{content:"";width:3px;height:3px;border-radius:50%;background:var(--line-2);
                 flex:none;margin-top:8px}
.spec code{font-family:var(--mono);font-size:11.5px;color:var(--ink);word-break:break-all}
.spec .api li code{color:var(--signal)}
.spec .note{background:var(--flag-bg);border-left:2px solid var(--flag);padding:9px 11px;
            font-size:12.5px;color:#6B4310;margin-top:7px;border-radius:0 4px 4px 0}
.spec .go{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.spec .go button{font-family:var(--mono);font-size:11px;border:1px solid var(--line);
                 padding:4px 8px;border-radius:4px;color:var(--ink-2)}
.spec .go button:hover{border-color:var(--signal);color:var(--signal)}

/* ── 와이어프레임 프리미티브 ──────────────────────────────────────────────
   실제 구현 시 이 클래스들은 디자인 시스템 컴포넌트로 1:1 치환됩니다.
   .appbar→AppBar  .fld→TextField  .btn→Button  .card→Card  .tbl→DataTable
   ------------------------------------------------------------------------ */
.screen{font-size:13px}
.appbar{height:46px;border-bottom:1px solid var(--line);display:flex;align-items:center;
        justify-content:space-between;padding:0 14px;font-weight:600;background:var(--surface-2)}
.appbar .ico{width:20px;height:20px;border:1px solid var(--line-2);border-radius:4px}
.pad{padding:14px}
.tabbar{height:54px;border-top:1px solid var(--line);display:flex;background:var(--surface-2)}
.tabbar div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
            gap:3px;font-size:10px;color:var(--ink-3)}
.tabbar div.on{color:var(--signal);font-weight:600}
.tabbar i{width:16px;height:16px;border:1.5px solid currentColor;border-radius:4px;display:block}
.box{border:1px dashed var(--line-2);border-radius:5px;display:flex;align-items:center;
     justify-content:center;color:var(--ink-3);font-size:11px;font-family:var(--mono);
     min-height:46px;padding:8px;text-align:center}
.fld{border:1px solid var(--line);border-radius:5px;height:36px;display:flex;align-items:center;
     padding:0 10px;color:var(--ink-3);font-size:12px;background:var(--surface)}
.fld.ta{height:64px;align-items:flex-start;padding-top:9px}
.lbl{font-size:11px;color:var(--ink-2);margin-bottom:4px;display:block;font-weight:500}
.btn{height:40px;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:6px;
     display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2);font-weight:500}
.btn.sm{height:30px;font-size:11.5px;width:auto;padding:0 11px}
.btn[data-go]{cursor:pointer}
.card{border:1px solid var(--line);border-radius:7px;padding:12px;background:var(--surface)}
.card.on{border-color:var(--signal);background:var(--signal-bg)}
.stack{display:flex;flex-direction:column}
.stack.g6{gap:6px}.stack.g10{gap:10px}.stack.g14{gap:14px}.stack.g20{gap:20px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mut{color:var(--ink-3)}.sm{font-size:11.5px}.b{font-weight:600}
.kv{font-size:12px;color:var(--ink-2)}.kv b{color:var(--ink);font-weight:600}
.meter{height:7px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--signal)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:99px;
      padding:3px 10px;font-size:11px;color:var(--ink-2);background:var(--surface)}
.chip.on{border-color:var(--signal);color:var(--signal);background:var(--signal-bg);font-weight:600}
.li{padding:11px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
    align-items:center;gap:10px}
.li:last-child{border-bottom:none}
.score{font-family:var(--mono);font-size:12px;color:var(--signal);font-weight:600}
.steps{display:flex;flex-direction:column}
.steps div{display:flex;gap:11px;align-items:flex-start;position:relative;padding-bottom:15px}
.steps div:last-child{padding-bottom:0}
.steps div::after{content:"";position:absolute;left:5.5px;top:14px;bottom:0;width:1px;background:var(--line)}
.steps div:last-child::after{display:none}
.steps b{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--surface);
         flex:none;margin-top:3px;z-index:1}
.steps .done b{background:var(--line-2)}
.steps .now b{border-color:var(--signal);box-shadow:0 0 0 3px var(--signal-bg)}
.steps .now{font-weight:600}
.steps .todo{color:var(--ink-3)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ink-3);
        text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line-2);font-weight:500}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);color:var(--ink-2)}
.tbl td:first-child{color:var(--ink);font-weight:500}
.stat{border:1px solid var(--line);border-radius:7px;padding:12px}
.stat .n{font-size:22px;font-weight:700;letter-spacing:-.02em;font-family:var(--mono)}
.stat .t{font-size:11px;color:var(--ink-3);margin-top:2px}
.kanban{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.kanban .col{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px;
             min-height:170px}
.kanban .col h5{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--ink-2);
                margin-bottom:8px;text-transform:uppercase}
.kanban .t{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:7px;
           font-size:11px;margin-bottom:6px}
.flag{background:var(--flag-bg);border:1px solid #E5CDA8;color:#6B4310;border-radius:5px;
      padding:8px 10px;font-size:11.5px}
.hr{height:1px;background:var(--line);margin:2px 0}
.side{width:180px;border-right:1px solid var(--line);padding:14px;background:var(--surface-2);flex:none}
.side .si{padding:7px 9px;border-radius:5px;font-size:12px;color:var(--ink-2)}
.side .si.on{background:var(--surface);border:1px solid var(--line);font-weight:600;color:var(--ink)}
.split{display:flex;align-items:stretch;min-height:420px}
.split .main{flex:1;padding:16px;min-width:0}

@media (max-width:1180px){
  .shell{grid-template-columns:1fr;height:auto}
  .nav{border-right:none;border-bottom:1px solid var(--line);max-height:220px}
  .spec{border-left:none;border-top:1px solid var(--line)}
  .canvas{padding:20px 16px 40px}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">CARELINK<span>화면 정의 &amp; 클릭형 와이어프레임</span></div>
  <div class="spacer"></div>
  <div class="phasefilter" role="group" aria-label="개발 단계 필터">
    <button data-phase="ALL" aria-pressed="true">전체</button>
    <button data-phase="V1" aria-pressed="false">V1</button>
    <button data-phase="V2" aria-pressed="false">V2</button>
    <button data-phase="V3" aria-pressed="false">V3</button>
  </div>
  <div class="pager">
    <button id="prev" aria-label="이전 화면">←</button>
    <button id="next" aria-label="다음 화면">→</button>
  </div>
</header>

<div class="shell">
  <nav class="nav" id="nav" aria-label="화면 목록"></nav>
  <main class="canvas">
    <div class="canvashead">
      <code id="sid"></code><h2 id="stitle"></h2><span class="tag" id="sphase"></span>
    </div>
    <div class="frame" id="frame">
      <div class="chrome"><i></i><i></i><i></i><span id="sroute"></span></div>
      <div class="screen" id="screen"></div>
    </div>
  </main>
  <aside class="spec" id="spec" aria-label="화면 사양"></aside>
</div>

<script>
/* ============================================================================
   SCREENS — 개발 사양의 단일 출처(Single Source of Truth)
   이 배열을 수정하면 화면 정의서가 갱신됩니다. PRD 문서를 따로 관리하지 마세요.
   ========================================================================= */
const APPS = {
  common:    {label:'공통',                 sub:'AUTH / ONBOARDING'},
  candidate: {label:'Candidate App',        sub:'MOBILE · 구직 인력'},
  org:       {label:'Organization Web',     sub:'DESKTOP · 병원·요양기관'},
  patient:   {label:'Patient / Family',     sub:'RESPONSIVE WEB · 환자·보호자'},
  caregiver: {label:'Caregiver App',        sub:'MOBILE · 간병사'},
  admin:     {label:'Admin Console',        sub:'DESKTOP · 운영자'}
};

const SCREENS = [
/* ─────────────────────────── A. 공통 ─────────────────────────── */
{
  id:'SCR-001', app:'common', device:'mobile', phase:'V1', title:'스플래시',
  route:'/',
  api:['GET /auth/me'],
  data:['access_token (secure storage)','user.roles[]','app_version'],
  states:['LOADING','AUTHENTICATED','ANONYMOUS','FORCE_UPDATE'],
  notes:'토큰 만료 시 refresh를 먼저 시도하고, 실패할 때만 로그인으로 보냅니다. 역할이 2개 이상이면 마지막 사용 역할로 복귀시킵니다.',
  next:['SCR-002','SCR-003'],
  body:`<div class="pad stack g20" style="min-height:520px;justify-content:center;align-items:center;text-align:center">
    <div style="letter-spacing:.28em;font-weight:700;font-size:17px">CARELINK</div>
    <div class="mut sm">Care. Connect. Trust.</div>
    <div class="box" style="width:120px;min-height:4px;padding:0"></div>
    <div class="mut sm" style="margin-top:auto;position:absolute;bottom:24px">v1.0.0 · 로그인 상태 확인 중</div>
  </div>`
},
{
  id:'SCR-002', app:'common', device:'mobile', phase:'V1', title:'로그인',
  route:'/login',
  api:['POST /auth/login','POST /auth/refresh','POST /auth/otp/send','POST /auth/otp/verify'],
  data:['email | phone','password','device_id','fcm_token'],
  states:['IDLE','SUBMITTING','INVALID_CREDENTIAL','LOCKED (5회 실패)','NEEDS_OTP'],
  notes:'후보자·간병사는 휴대전화 OTP 로그인 비중이 높습니다. 비밀번호는 선택 수단으로 두고 OTP를 1차 경로로 설계하세요.',
  next:['SCR-003','SCR-101'],
  body:`<div class="appbar"><span>로그인</span><span class="mut sm">KO / VI / RU / EN</span></div>
  <div class="pad stack g14">
    <div><span class="lbl">이메일 또는 휴대전화</span><div class="fld">example@carelink.kr</div></div>
    <div><span class="lbl">비밀번호</span><div class="fld">••••••••</div></div>
    <div class="btn" data-go="SCR-003">로그인</div>
    <div class="btn ghost">인증번호로 로그인</div>
    <div class="row between sm mut"><span>회원가입</span><span>비밀번호 찾기</span></div>
    <div class="hr" style="margin:8px 0"></div>
    <div class="flag">F-001 · 약관 동의는 필수/선택을 분리하고, 민감정보(건강·자격 증빙) 처리 동의를 별도 항목으로 받습니다.</div>
  </div>`
},
{
  id:'SCR-003', app:'common', device:'mobile', phase:'V1', title:'역할 선택',
  route:'/onboarding/role',
  api:['POST /users/{id}/roles','GET /auth/me'],
  data:['user_id','role: CANDIDATE | CAREGIVER | PATIENT_FAMILY | ORG_MEMBER','is_primary'],
  states:['NO_ROLE','ROLE_SELECTED','PENDING_ORG_APPROVAL'],
  notes:'설계 원칙: USERS와 USER_ROLES를 분리해 한 계정이 복수 역할을 갖도록 합니다. 요양보호사가 간병사로도 일하는 경우가 실제로 흔합니다. ORG_MEMBER는 기관 관리자 승인 전까지 PENDING 상태로 둡니다.',
  next:['SCR-101','SCR-301','SCR-401','SCR-201'],

/* ============================================================================
   렌더러 — 사양(SCREENS)을 화면으로 그립니다. 제품 코드가 아니라 문서 뷰어입니다.
   ========================================================================= */
const $ = s => document.querySelector(s);
let idx = 0, phaseFilter = 'ALL';

function visible(){ return SCREENS.filter(s => phaseFilter==='ALL' || s.phase===phaseFilter); }

function buildNav(){
  const nav = $('#nav'); nav.innerHTML = '';
  Object.entries(APPS).forEach(([key, meta]) => {
    const items = SCREENS.filter(s => s.app === key);
    if(!items.length) return;
    const h = document.createElement('h3');
    h.innerHTML = `${meta.label} <em>· ${meta.sub}</em>`;
    nav.appendChild(h);
    items.forEach(s => {
      const b = document.createElement('button');
      b.className = 'navitem' + ((phaseFilter!=='ALL' && s.phase!==phaseFilter) ? ' dim' : '');
      b.innerHTML = `<code>${s.id.replace('SCR-','')}</code><span>${s.title}</span>`;
      b.setAttribute('aria-current', SCREENS[idx].id === s.id);
      b.onclick = () => go(s.id);
      nav.appendChild(b);
    });
  });
}

function list(title, arr, cls){
  if(!arr || !arr.length) return '';
  return `<h4>${title}</h4><ul class="${cls||''}">` +
    arr.map(v => `<li><code>${v}</code></li>`).join('') + '</ul>';
}

function render(){
  const s = SCREENS[idx];
  $('#sid').textContent = s.id;
  $('#stitle').textContent = s.title;
  $('#sphase').textContent = s.phase;
  $('#sphase').className = 'tag ' + s.phase.toLowerCase();
  $('#sroute').textContent = s.route;
  $('#frame').className = 'frame ' + s.device;
  $('#screen').innerHTML = s.body;

  $('#spec').innerHTML =
    `<h4>Route</h4><ul><li><code>${s.route}</code></li></ul>` +
    list('API', s.api, 'api') +
    list('핵심 데이터', s.data) +
    list('상태값', s.states) +
    (s.notes ? `<h4>설계 노트</h4><div class="note">${s.notes}</div>` : '') +
    (s.next && s.next.length ? `<h4>다음 화면</h4><div class="go">` +
      s.next.map(n => `<button data-jump="${n}">${n}</button>`).join('') + `</div>` : '');

  document.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => go(b.dataset.jump));
  document.querySelectorAll('#screen [data-go]').forEach(el => {
    el.style.cursor = 'pointer';
    el.onclick = () => go(el.dataset.go);
  });
  buildNav();
  $('.canvas').scrollTop = 0;
}

function go(id){
  const i = SCREENS.findIndex(s => s.id === id);
  if(i >= 0){ idx = i; render(); }
}

function step(dir){
  const v = visible();
  if(!v.length) return;
  let p = v.findIndex(s => s.id === SCREENS[idx].id);
  if(p < 0) p = 0; else p = (p + dir + v.length) % v.length;
  go(v[p].id);
}

$('#prev').onclick = () => step(-1);
$('#next').onclick = () => step(1);
document.addEventListener('keydown', e => {
  if(e.target.closest('input,textarea')) return;
  if(e.key === 'ArrowLeft') step(-1);
  if(e.key === 'ArrowRight') step(1);
});
document.querySelectorAll('.phasefilter button').forEach(b => {
  b.onclick = () => {
    phaseFilter = b.dataset.phase;
    document.querySelectorAll('.phasefilter button')
      .forEach(x => x.setAttribute('aria-pressed', x === b));
    const v = visible();
    if(v.length && !v.find(s => s.id === SCREENS[idx].id)) go(v[0].id);
    else buildNav();
  };
});

render();
</script>
</body>
</html>
